<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hash Hedge Signals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Tektur:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("hh-theme");
        var theme = t === "punk" || t === "dark" ? t : t === "light" ? "punk" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root">
      <p class="html-boot" aria-live="polite">Загрузка…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
